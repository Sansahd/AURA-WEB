<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="GEKKO — gecko élancé autour de la Terre">
<defs>
  <radialGradient id="back" cx="34%" cy="22%" r="104%"><stop stop-color="#123948"/><stop offset=".48" stop-color="#061e2b"/><stop offset="1" stop-color="#020c16"/></radialGradient>
  <radialGradient id="water" cx="28%" cy="23%" r="85%"><stop stop-color="#7bf8f2"/><stop offset=".34" stop-color="#18afba"/><stop offset=".72" stop-color="#08738d"/><stop offset="1" stop-color="#09304d"/></radialGradient>
  <linearGradient id="lime" x1="45" y1="18" x2="200" y2="222" gradientUnits="userSpaceOnUse">
    <stop stop-color="#edff9e"/><stop offset=".24" stop-color="#c4ff8e"/><stop offset=".57" stop-color="#78efac"/><stop offset=".82" stop-color="#2ed5bc"/><stop offset="1" stop-color="#0b9cb4"/>
  </linearGradient>
  <linearGradient id="highlight" x1="102" y1="26" x2="195" y2="101" gradientUnits="userSpaceOnUse">
    <stop stop-color="#efffb5"/><stop offset=".63" stop-color="#acffc1"/><stop offset="1" stop-color="#46dcca"/>
  </linearGradient>
</defs>
<rect width="256" height="256" rx="59" fill="url(#back)"/>
<rect x="1.3" y="1.3" width="253.4" height="253.4" rx="58" fill="none" stroke="#46b9c1" stroke-opacity=".31" stroke-width="2.6"/>
<circle cx="140" cy="140" r="73.5" fill="#052a3a" stroke="#6fe3d8" stroke-width="1.7" stroke-opacity=".7"/>
<circle id="earth" cx="140" cy="140" r="69.5" fill="url(#water)"/>
<path class="continent" d="M122 84l16-8 15 4 12 10-5 11-12 2-7 17-16-3-6-12-9-10z" fill="#82d99c"/>
<path class="continent" d="M115 114l19 7 9 14-7 16-1 15-11 24-13 11-9-14 2-25-11-17 10-19z" fill="#b2e89d"/>
<path class="continent" d="M161 98l21 4 11 14 14 3 2 15-13 12-17-6-11 12-11-13 4-14-8-11z" fill="#91e5aa"/>
<path class="continent" d="M180 167l18-2 9 11-10 13-13-7z" fill="#77d1a0"/>
<ellipse cx="118" cy="113" rx="40" ry="58" transform="rotate(28 118 113)" fill="none" stroke="#d1fff0" stroke-opacity=".21" stroke-width="2.5"/>
<circle cx="140" cy="140" r="68" fill="none" stroke="#c5fff6" stroke-opacity=".22" stroke-width="3"/>
<g id="gecko" stroke-linecap="round" stroke-linejoin="round">
  <!-- Sleek dorsal arc: no oversized tadpole body. -->
  <path d="M163 53C135 34 107 41 89 54 57 78 52 118 64 153c8 24 27 39 44 43" fill="none" stroke="#032d31" stroke-width="24"/>
  <path d="M163 53C135 34 107 41 89 54 57 78 52 118 64 153c8 24 27 39 44 43" fill="none" stroke="url(#lime)" stroke-width="17"/>
  <path d="M150 48C122 35 97 47 81 64 61 87 57 117 69 143" fill="none" stroke="#f1ffc8" stroke-opacity=".6" stroke-width="3.4"/>
  <!-- A long tapering, curled tail embraces rather than obscures the globe. -->
  <path d="M107 195c22 19 54 24 78 5 18-15 15-37 1-46-11-8-24-1-25 10-1 9 5 14 12 14" fill="none" stroke="#043344" stroke-width="17"/>
  <path d="M107 195c22 19 54 24 78 5 18-15 15-37 1-46-11-8-24-1-25 10-1 9 5 14 12 14" fill="none" stroke="url(#lime)" stroke-width="11"/>
  <path d="M166 177c4 1 8 0 10-4" fill="none" stroke="#daffd1" stroke-width="3.6"/>
  <!-- Long tapered head with recognizable snout and a normal-sized eye. -->
  <path d="M132 43c11-13 29-18 45-14 14 3 21 14 22 24-1 10-12 17-24 18l-25-7-15-9z" fill="url(#highlight)" stroke="#c4ffe1" stroke-width="1.6"/>
  <path d="M147 38c16-10 35-4 42 5" fill="none" stroke="#f7ffd4" stroke-opacity=".61" stroke-width="2.5"/>
  <ellipse cx="181" cy="44" rx="5.5" ry="6.4" fill="#082832"/>
  <circle cx="183" cy="41.6" r="1.8" fill="white"/>
  <path d="M182 60c4 0 8-1 12-4" stroke="#347f70" stroke-width="1.7" fill="none"/>
  <!-- Four distinct slender limbs and flattened gecko toes. -->
  <g fill="none" stroke="url(#lime)" stroke-width="7.8">
    <path d="M105 48L97 79 82 94"/><path d="M139 51L135 78 149 89"/>
    <path d="M69 141L89 160 103 158"/><path d="M88 179L113 185 128 174"/>
  </g>
  <g class="toe" stroke="#d7ffc0" stroke-width="3.9" fill="none">
    <path d="M82 94l-13-2m13 2l-6 9m6-9l-2-12"/>
    <path d="M149 89l10-7m-10 7l13 3m-13-3l4 11"/>
    <path d="M103 158l10-9m-10 9l14 2m-14-2l6 10"/>
    <path d="M128 174l13-5m-13 5l10 6m-10-6l0-11"/>
  </g>
</g>
</svg>