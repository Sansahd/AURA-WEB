<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="window-shell.css">
  <link rel="stylesheet" href="persona-sidestage.css">
  <link rel="stylesheet" href="product-suite.css">
  <link rel="stylesheet" href="quantic-glide-brand.css">
  <title>GEKKO</title>
</head>
<body>
<div id="shell">
  <header id="chrome">
    <div class="tabs-row">
      <button id="logo" class="logo no-drag" title="Accueil GEKKO" aria-label="Accueil GEKKO"><img src="../assets/quantic-glide-mark.svg" alt="GEKKO"></button>
      <div id="tabs" class="tabs no-drag"></div>
      <button id="plus" class="plus no-drag" title="Nouvel onglet" aria-label="Nouvel onglet">+</button>
      <div class="drag-zone"></div>
      <div class="window-controls no-drag">
        <button data-win="minimize" aria-label="Réduire">—</button>
        <button data-win="maximize" aria-label="Agrandir">□</button>
        <button data-win="close" aria-label="Fermer">×</button>
      </div>
    </div>
  </header>

  <nav id="bottom-dock" class="bottom-dock no-drag" aria-label="Navigation GEKKO">
    <div class="nav-row">
      <div class="dock-cluster dock-history" aria-label="Historique de navigation">
        <button id="back" class="dock-control" title="Précédent" aria-label="Précédent">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6 9 12l6 6"/></svg>
        </button>
        <button id="forward" class="dock-control" title="Suivant" aria-label="Suivant">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <button id="reload" class="dock-control" title="Actualiser" aria-label="Actualiser">
          <svg class="icon-reload" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7v5h-5"/><path d="M18.2 12A6.5 6.5 0 1 1 16.5 7.6L19 10"/></svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="7.5" width="9" height="9" rx="2"/></svg>
        </button>
      </div>

      <div class="dock-separator" aria-hidden="true"></div>

      <div class="dock-cluster dock-primary" aria-label="Navigation principale">
        <button id="home-button" class="dock-control" title="Accueil" aria-label="Accueil">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 8-6 8 6"/><path d="M6.5 10.5V20h11v-9.5"/><path d="M10 20v-5h4v5"/></svg>
        </button>
        <button id="discover" class="dock-control" title="Découvrir" aria-label="Découvrir">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m14.8 9.2-2 5.6-3.6 1.4 1.4-3.6 4.2-3.4Z"/></svg>
        </button>
        <button id="bookmarks" class="dock-control" title="Favoris" aria-label="Favoris">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5h10v15l-5-3-5 3v-15Z"/></svg>
        </button>
        <button id="apps-button" class="dock-control" title="Apps Quantic" aria-label="Ouvrir les apps">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="5" height="5" rx="1"/><rect x="14" y="5" width="5" height="5" rx="1"/><rect x="5" y="14" width="5" height="5" rx="1"/><rect x="14" y="14" width="5" height="5" rx="1"/></svg>
        </button>
      </div>

      <div class="address-wrap">
        <div class="address glass-line">
          <button id="search-engine-button" class="search-engine-button" type="button" aria-haspopup="menu" aria-expanded="false" data-engine="gekko" title="Moteur de recherche">
            <span id="search-engine-mark" class="search-engine-mark"><span id="search-engine-mark-text">G</span></span>
            <span id="search-engine-label" class="search-engine-label">GEKKO</span>
            <svg class="engine-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg>
          </button>
          <span class="address-divider" aria-hidden="true"></span>
          <svg class="address-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="address" autocomplete="off" spellcheck="false" placeholder="Rechercher ou saisir une adresse…">
          <button id="address-go" class="address-go" type="button" title="Ouvrir" aria-label="Ouvrir">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13"/><path d="m14 7 5 5-5 5"/></svg>
          </button>
        </div>
        <div id="site-suggestions" class="site-suggestions hidden" role="listbox" aria-label="Sites populaires"></div>
        <div id="search-engine-menu" class="search-engine-menu hidden" role="menu" aria-label="Choisir le moteur de recherche">
          <div class="engine-menu-head">
            <div><span>SEARCH ROUTE</span><strong>Choisir le moteur</strong></div>
            <small>Le choix reste actif pour les recherches suivantes.</small>
          </div>
          <div class="engine-menu-grid">
            <button class="engine-option featured" type="button" role="menuitemradio" data-search-engine="gekko" aria-checked="true">
              <span class="engine-badge gekko"><img src="../assets/quantic-glide-mark.svg" alt=""></span>
              <span class="engine-copy"><strong>GEKKO Search</strong><small>Recherche interne · intentions</small></span>
              <span class="engine-check">✓</span>
            </button>
            <button class="engine-option" type="button" role="menuitemradio" data-search-engine="duckduckgo" aria-checked="false">
              <span class="engine-badge duck">D</span>
              <span class="engine-copy"><strong>DuckDuckGo</strong><small>Privé · direct</small></span>
              <span class="engine-check">✓</span>
            </button>
            <button class="engine-option" type="button" role="menuitemradio" data-search-engine="qwant" aria-checked="false">
              <span class="engine-badge qwant">Q</span>
              <span class="engine-copy"><strong>Qwant</strong><small>Européen · direct</small></span>
              <span class="engine-check">✓</span>
            </button>
            <button class="engine-option" type="button" role="menuitemradio" data-search-engine="startpage" aria-checked="false">
              <span class="engine-badge startpage">S</span>
              <span class="engine-copy"><strong>Startpage</strong><small>Google sans profilage</small></span>
              <span class="engine-check">✓</span>
            </button>
            <button class="engine-option" type="button" role="menuitemradio" data-search-engine="brave" aria-checked="false">
              <span class="engine-badge brave">B</span>
              <span class="engine-copy"><strong>Brave Search</strong><small>Index indépendant</small></span>
              <span class="engine-check">✓</span>
            </button>
            <button class="engine-option" type="button" role="menuitemradio" data-search-engine="searxng" aria-checked="false">
              <span class="engine-badge searxng">Sx</span>
              <span class="engine-copy"><strong>SearXNG</strong><small>Métamoteur open source</small></span>
              <span class="engine-check">✓</span>
            </button>
            <button class="engine-option tor-option" type="button" role="menuitemradio" data-search-engine="tor" aria-checked="false">
              <span class="engine-badge tor">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c3.2 2 5.5 5.2 5.5 8.8A5.5 5.5 0 0 1 12 17.8a5.5 5.5 0 0 1-5.5-5.5C6.5 8.7 8.8 5.5 12 3.5Z"/><path d="M9 20.5h6"/><path d="M12 7v10.5"/></svg>
              </span>
              <span class="engine-copy"><strong>Tor · Veil</strong><small>DuckDuckGo via espace privé Tor</small></span>
              <span class="engine-route-pill">ROUTED</span>
              <span class="engine-check">✓</span>
            </button>
          </div>
        </div>
      </div>

      <div class="dock-separator" aria-hidden="true"></div>

      <div class="dock-cluster dock-actions">
        <button id="fav" class="dock-control" title="Ajouter aux favoris" aria-label="Ajouter aux favoris">
          <svg class="icon-star-outline" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.4 7.2 19l.9-5.5-3.9-3.8 5.4-.8L12 4Z"/></svg>
          <svg class="icon-star-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.4 7.2 19l.9-5.5-3.9-3.8 5.4-.8L12 4Z"/></svg>
        </button>
        <button id="sidestage" class="dock-control" title="SideStage" aria-label="Ouvrir SideStage">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M15 5v14"/></svg>
        </button>
        <button id="ai" class="dock-control aura-control" title="AURA" aria-label="AURA">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 13.6 9l5.4 1.6-5.4 1.6L12 18l-1.6-5.8L5 10.6 10.4 9 12 3.5Z"/><path d="m18.2 15 .8 2.3 2.3.7-2.3.7-.8 2.3-.7-2.3-2.3-.7 2.3-.7.7-2.3Z"/></svg>
        </button>
        <button id="downloads" class="dock-control" title="Téléchargements GEKKO" aria-label="Téléchargements">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="m8 10 4 4 4-4"/><path d="M5 19h14"/></svg>
        </button>
        <button id="persona" class="dock-control" title="Paramètres" aria-label="Paramètres">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.7-1L14.5 3h-5l-.4 3.1a8 8 0 0 0-1.7 1L5 6.1 3 9.5 5 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.4 3.1h5l.4-3.1a8 8 0 0 0 1.7-1l2.4 1 2-3.4L19 13a7 7 0 0 0 0-1Z"/></svg>
        </button>
        <button id="menu" class="dock-control" title="Menu" aria-label="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <aside id="apps-panel" class="apps-panel hidden" aria-label="Applications Quantic">
    <div class="apps-panel-head">
      <div><small>QUANTIC SILLAGE</small><strong>Apps</strong></div>
      <button id="apps-close" type="button" aria-label="Fermer">×</button>
    </div>
    <div class="apps-grid">
      <button class="app-tile" data-app-url="https://antiquewhite-dolphin-780448.hostingersite.com/"><span>✦</span><strong>AURA</strong><small>Intelligence</small></button>
      <button class="app-tile" data-app-url="https://mediumorchid-badger-314305.hostingersite.com/mail/"><span>✉</span><strong>Mail</strong><small>Communication</small></button>
      <button class="app-tile" data-app-url="https://mediumorchid-badger-314305.hostingersite.com/pulse/"><span>◉</span><strong>ZOON</strong><small>Social</small></button>
      <button class="app-tile" data-app-url="https://mediumorchid-badger-314305.hostingersite.com/news/"><span>⌁</span><strong>News</strong><small>Information</small></button>
      <button class="app-tile" data-app-url="https://mediumorchid-badger-314305.hostingersite.com/vision/"><span>◇</span><strong>Providence</strong><small>Analyse</small></button>
      <button class="app-tile" data-app-url="quantic://settings"><span>⚙</span><strong>GEKKO</strong><small>Réglages</small></button>
    </div>
  </aside>

  <section id="home" class="home">
    <div class="gekko-home-scene" aria-label="Nouvel onglet GEKKO">
      <div class="gekko-home-sky" aria-hidden="true"></div>
      <div class="gekko-home-aurora" aria-hidden="true"></div>
      <div class="gekko-home-mountains back" aria-hidden="true"></div>
      <div class="gekko-home-mountains front" aria-hidden="true"></div>
      <div class="gekko-home-reflection" aria-hidden="true"></div>

      <div class="gekko-home-tools" aria-label="Actions GEKKO">
        <button id="home-tool-home" class="home-tool-button" type="button" title="Accueil" aria-label="Accueil">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 8-6 8 6"/><path d="M6.5 10.5V20h11v-9.5"/><path d="M10 20v-5h4v5"/></svg>
        </button>
        <button id="home-tool-shield" class="home-tool-button" type="button" data-quantic-suite="shield" title="Quantic Shield" aria-label="Quantic Shield">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19 6v5.2c0 4.5-2.8 7.8-7 9.3-4.2-1.5-7-4.8-7-9.3V6l7-2.5Z"/><path d="m9.2 12 1.8 1.8 3.9-4"/></svg>
        </button>
        <button id="home-tool-apps" class="home-tool-button" type="button" title="Apps Quantic" aria-label="Apps Quantic">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="5" height="5" rx="1"/><rect x="14" y="5" width="5" height="5" rx="1"/><rect x="5" y="14" width="5" height="5" rx="1"/><rect x="14" y="14" width="5" height="5" rx="1"/></svg>
        </button>
        <button id="home-tool-settings" class="home-tool-button" type="button" title="Paramètres" aria-label="Paramètres">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.7-1L14.5 3h-5l-.4 3.1a8 8 0 0 0-1.7 1L5 6.1 3 9.5 5 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.4 3.1h5l.4-3.1a8 8 0 0 0 1.7-1l2.4 1 2-3.4L19 13a7 7 0 0 0 0-1Z"/></svg>
        </button>
      </div>

      <div class="gekko-home-brand">
        <img src="../assets/quantic-glide-mark.svg" alt="GEKKO">
        <strong>GEKKO</strong>
        <span>BROWSE FREELY</span>
      </div>

      <div class="gekko-home-cards" aria-label="Actions rapides GEKKO">
        <button class="gekko-home-card" data-home-action="private-search">
          <span class="home-card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/><path d="M4.5 5.5 7 3l2.2 2.2"/></svg></span>
          <span class="home-card-copy"><strong>Private Search</strong><small>No tracking. Just results.</small></span>
          <svg class="home-card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10"/><path d="m13 8 4 4-4 4"/></svg>
        </button>
        <button class="gekko-home-card" data-home-action="secure-tabs">
          <span class="home-card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5h14v11H5z"/><path d="M8 7.5V5h8v2.5"/><path d="M12 11v3"/><circle cx="12" cy="10.5" r="1.5"/></svg></span>
          <span class="home-card-copy"><strong>Secure Tabs</strong><small>Your browsing stays yours.</small></span>
          <svg class="home-card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10"/><path d="m13 8 4 4-4 4"/></svg>
        </button>
        <button class="gekko-home-card" data-home-action="fast-light">
          <span class="home-card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 3-6 10h5l-1 8 6-11h-5l1-7Z"/></svg></span>
          <span class="home-card-copy"><strong>Fast &amp; Light</strong><small>Built for a smoother web.</small></span>
          <svg class="home-card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10"/><path d="m13 8 4 4-4 4"/></svg>
        </button>
        <button class="gekko-home-card" data-home-action="explore-more">
          <span class="home-card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m14.6 9.4-2 5.2-3.2 1.2 1.2-3.2 4-3.2Z"/></svg></span>
          <span class="home-card-copy"><strong>Explore More</strong><small>A cleaner, calmer web.</small></span>
          <svg class="home-card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10"/><path d="m13 8 4 4-4 4"/></svg>
        </button>
      </div>

      <div class="gekko-home-caption">
        <span>PRIVATE BY DESIGN</span>
        <span>FAST &amp; LIGHT</span>
        <span>A CLEANER WEB</span>
      </div>
    </div>

    <div id="quantic-suite-panel" class="quantic-suite-panel hidden" aria-live="polite">
      <div class="quantic-suite-head"><h2 id="quantic-suite-title">Quantic</h2><button id="quantic-suite-close" type="button" aria-label="Fermer">×</button></div>
      <div id="quantic-suite-body" class="quantic-suite-body"></div>
    </div>
  </section>

  <section id="internal-page" class="internal-page hidden" aria-live="polite">
    <div id="internal-content" class="internal-content"></div>
  </section>

  <aside id="sidestage-rail" class="hidden" aria-label="SideStage · Lecteurs persistants"></aside>

  <aside id="ai-panel" class="ai-panel glass closed">
    <div class="ai-head"><img src="../assets/quantic-glide-mark.svg" alt="GEKKO"><strong>AURA 2.0</strong><button id="ai-close" aria-label="Fermer">×</button></div>
    <div id="ai-engine" class="ai-engine">AURA 2.0 · local</div>
    <div class="orb"></div>
    <p>Assistant de navigation local-first, relié au MoA et au Mesh AURA.</p>
    <button data-ai="summarize">Résumer cette page</button>
    <button data-ai="compare">Comparer les onglets</button>
    <button data-ai="plan">Créer un plan</button>
    <div id="ai-output" class="ai-output">Prêt.</div>
    <div class="ai-chat"><textarea id="ai-prompt" placeholder="Posez-moi une question…"></textarea><button id="ai-send" title="Envoyer">→</button></div>
  </aside>
</div>
<script src="site-cache.js"></script>
<script src="renderer.js"></script>
<script src="product-suite.js"></script>
</body>
</html>
