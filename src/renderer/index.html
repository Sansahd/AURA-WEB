<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="window-shell.css">
  <link rel="stylesheet" href="persona-sidestage.css">
  <link rel="stylesheet" href="product-suite.css">
  <link rel="stylesheet" href="quantic-glide-brand.css">
  <title>GEKKO</title>
</head>
<body>
<div id="shell">
  <header id="chrome">
    <div class="tabs-row">
      <button id="logo" class="logo no-drag" title="Accueil GEKKO" aria-label="Accueil GEKKO"><img src="../assets/quantic-glide-mark.svg" alt="GEKKO"></button>
      <div id="tabs" class="tabs no-drag"></div>
      <button id="plus" class="plus no-drag" title="Nouvel onglet" aria-label="Nouvel onglet">+</button>
      <div class="drag-zone"></div>
      <div class="window-controls no-drag">
        <button data-win="minimize" aria-label="Réduire">—</button>
        <button data-win="maximize" aria-label="Agrandir">□</button>
        <button data-win="close" aria-label="Fermer">×</button>
      </div>
    </div>
  </header>

  <nav id="bottom-dock" class="bottom-dock no-drag" aria-label="Navigation GEKKO">
    <div class="nav-row">
      <div class="dock-history">
        <button id="back" title="Précédent" aria-label="Précédent">‹</button>
        <button id="forward" title="Suivant" aria-label="Suivant">›</button>
        <button id="reload" title="Actualiser" aria-label="Actualiser">↻</button>
      </div>
      <button id="dock-brand" class="dock-brand" title="Accueil GEKKO" aria-label="Accueil GEKKO">
        <img src="../assets/quantic-glide-mark.svg" alt=""><span>GEKKO</span>
      </button>
      <div class="dock-nav">
        <button id="home-button" title="Accueil" aria-label="Accueil"><span>⌂</span><small>Home</small></button>
        <button id="discover" title="Découvrir" aria-label="Découvrir"><span>◎</span><small>Discover</small></button>
        <button id="bookmarks" title="Favoris" aria-label="Favoris"><span>♡</span><small>Bookmarks</small></button>
        <button id="apps-button" title="Apps Quantic" aria-label="Ouvrir les apps"><span>▦</span><small>Apps</small></button>
      </div>
      <div class="address glass-line">
        <span class="address-search">⌕</span>
        <input id="address" autocomplete="off" spellcheck="false" placeholder="Search or enter a URL…">
        <button id="address-go" type="button" title="Ouvrir" aria-label="Ouvrir">→</button>
      </div>
      <div class="dock-actions">
        <button id="fav" title="Ajouter aux favoris" aria-label="Ajouter aux favoris">☆</button>
        <button id="sidestage" title="SideStage · Lecteurs persistants" aria-label="Ouvrir SideStage">◫</button>
        <button id="ai" title="AURA" aria-label="AURA">✦</button>
        <button id="downloads" title="Téléchargements GEKKO" aria-label="Téléchargements">⇩</button>
        <button id="persona" title="Paramètres" aria-label="Paramètres">⚙</button>
        <button id="menu" title="Menu" aria-label="Menu">⋮</button>
      </div>
    </div>
  </nav>

  <div id="navigation-transition" class="navigation-transition" aria-hidden="true">
    <div class="transition-aura"></div>
    <img src="../assets/quantic-glide-mark.svg" alt="">
    <strong>GEKKO</strong>
  </div>

  <aside id="apps-panel" class="apps-panel hidden" aria-label="Applications Quantic">
    <div class="apps-panel-head">
      <div><small>QUANTIC SILLAGE</small><strong>Apps</strong></div>
      <button id="apps-close" type="button" aria-label="Fermer">×</button>
    </div>
    <div class="apps-grid">
      <button class="app-tile" data-app-url="https://antiquewhite-dolphin-780448.hostingersite.com/"><span>✦</span><strong>AURA</strong><small>Intelligence</small></button>
      <button class="app-tile" data-app-url="https://mediumorchid-badger-314305.hostingersite.com/mail/"><span>✉</span><strong>Mail</strong><small>Communication</small></button>
      <button class="app-tile" data-app-url="https://mediumorchid-badger-314305.hostingersite.com/pulse/"><span>◉</span><strong>ZOON</strong><small>Social</small></button>
      <button class="app-tile" data-app-url="https://mediumorchid-badger-314305.hostingersite.com/news/"><span>⌁</span><strong>News</strong><small>Information</small></button>
      <button class="app-tile" data-app-url="https://mediumorchid-badger-314305.hostingersite.com/vision/"><span>◇</span><strong>Providence</strong><small>Analyse</small></button>
      <button class="app-tile" data-app-url="quantic://settings"><span>⚙</span><strong>GEKKO</strong><small>Réglages</small></button>
    </div>
  </aside>

  <section id="home" class="home">
    <div class="gekko-home-scene" aria-label="Nouvel onglet GEKKO">
      <div class="gekko-home-sky" aria-hidden="true"></div>
      <div class="gekko-home-aurora" aria-hidden="true"></div>
      <div class="gekko-home-mountains back" aria-hidden="true"></div>
      <div class="gekko-home-mountains front" aria-hidden="true"></div>
      <div class="gekko-home-reflection" aria-hidden="true"></div>

      <div class="gekko-home-tools" aria-label="Actions GEKKO">
        <button id="home-tool-home" type="button" title="Accueil" aria-label="Accueil">⌂</button>
        <button id="home-tool-shield" type="button" data-quantic-suite="shield" title="Quantic Shield" aria-label="Quantic Shield">♢</button>
        <button id="home-tool-apps" type="button" title="Apps Quantic" aria-label="Apps Quantic">▦</button>
        <button id="home-tool-settings" type="button" title="Paramètres" aria-label="Paramètres">♙</button>
      </div>

      <div class="gekko-home-brand">
        <img src="../assets/quantic-glide-mark.svg" alt="GEKKO">
        <strong>GEKKO</strong>
        <span>BROWSE FREELY</span>
      </div>

      <div class="gekko-home-cards" aria-label="Actions rapides GEKKO">
        <button class="gekko-home-card" data-home-action="private-search">
          <b>▣</b><strong>Private Search</strong><span>No tracking.<br>Just results.</span>
        </button>
        <button class="gekko-home-card" data-home-action="secure-tabs">
          <b>◇</b><strong>Secure Tabs</strong><span>Keep your<br>browsing yours.</span>
        </button>
        <button class="gekko-home-card" data-home-action="fast-light">
          <b>ϟ</b><strong>Fast &amp; Light</strong><span>Built for a<br>smoother web.</span>
        </button>
        <button class="gekko-home-card" data-home-action="explore-more">
          <b>◒</b><strong>Explore More</strong><span>A cleaner,<br>brighter internet.</span>
        </button>
      </div>

      <div class="gekko-home-caption">
        <span>PRIVATE BY DESIGN</span>
        <span>FAST &amp; LIGHT</span>
        <span>A CLEANER WEB</span>
      </div>
    </div>

    <div id="quantic-suite-panel" class="quantic-suite-panel hidden" aria-live="polite">
      <div class="quantic-suite-head"><h2 id="quantic-suite-title">Quantic</h2><button id="quantic-suite-close" type="button" aria-label="Fermer">×</button></div>
      <div id="quantic-suite-body" class="quantic-suite-body"></div>
    </div>
  </section>

  <section id="internal-page" class="internal-page hidden" aria-live="polite">
    <div id="internal-content" class="internal-content"></div>
  </section>

  <aside id="sidestage-rail" class="hidden" aria-label="SideStage · Lecteurs persistants"></aside>

  <aside id="ai-panel" class="ai-panel glass closed">
    <div class="ai-head"><img src="../assets/quantic-glide-mark.svg" alt="GEKKO"><strong>AURA 2.0</strong><button id="ai-close" aria-label="Fermer">×</button></div>
    <div id="ai-engine" class="ai-engine">AURA 2.0 · local</div>
    <div class="orb"></div>
    <p>Assistant de navigation local-first, relié au MoA et au Mesh AURA.</p>
    <button data-ai="summarize">Résumer cette page</button>
    <button data-ai="compare">Comparer les onglets</button>
    <button data-ai="plan">Créer un plan</button>
    <div id="ai-output" class="ai-output">Prêt.</div>
    <div class="ai-chat"><textarea id="ai-prompt" placeholder="Posez-moi une question…"></textarea><button id="ai-send" title="Envoyer">→</button></div>
  </aside>
</div>
<script src="renderer.js"></script>
<script src="product-suite.js"></script>
</body>
</html>
