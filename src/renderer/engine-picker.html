<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>GEKKO · Moteurs de recherche</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:transparent;color:#eafff3;font-family:'Segoe UI',system-ui,sans-serif;user-select:none}
.bubble{position:absolute;inset:5px 4px 13px;border-radius:23px;padding:11px 13px 12px;border:1px solid rgba(196,255,220,.35);background:linear-gradient(125deg,rgba(20,48,43,.99),rgba(43,34,52,.99) 52%,rgba(48,38,35,.99));box-shadow:0 16px 36px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,241,228,.19)}
.bubble:after{content:'';position:absolute;width:11px;height:11px;bottom:-7px;left:31px;transform:rotate(45deg);border-right:1px solid rgba(196,255,220,.35);border-bottom:1px solid rgba(196,255,220,.35);background:#202a30}
.heading{display:flex;justify-content:space-between;align-items:center;padding:0 2px;margin-bottom:6px;color:#e6ffef;font-size:10px;font-weight:720;letter-spacing:.08em}
.heading small{font-size:9px;color:#b7d7c8;font-weight:550}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 2px;justify-items:center;width:100%;overflow:visible}
.engine{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:56px;height:67px;padding:2px 0;border:1px solid transparent;border-radius:12px;background:transparent;color:#eafcf2;cursor:pointer}
.engine:hover,.engine:focus-visible{outline:0;border-color:rgba(206,245,217,.28);background:linear-gradient(145deg,rgba(140,255,201,.13),rgba(241,161,191,.12))}
.engine.selected{border-color:rgba(154,255,205,.48);background:linear-gradient(130deg,rgba(96,232,174,.19),rgba(204,143,232,.14))}
.symbol{display:grid;place-items:center;width:37px;height:37px;flex:0 0 37px;border-radius:50%;border:1px solid rgba(221,249,224,.2);background:linear-gradient(148deg,rgba(255,255,255,.95),rgba(235,242,240,.87));box-shadow:inset 0 1px 1px rgba(255,255,255,.84),0 3px 10px rgba(0,0,0,.22)}
.symbol img{width:24px;height:24px;object-fit:contain}
.engine[data-engine="gekko"] .symbol{background:linear-gradient(135deg,#215c44,#344b6d)}
.engine[data-engine="gekko"] .symbol img{width:31px;height:31px}
.engine[data-engine="tor"] .symbol{background:#f5e9fc}
.name{font-size:8.5px;font-weight:570;text-align:center;line-height:1.1;white-space:nowrap;max-width:58px}
.engine[data-engine="tor"]{grid-column:2 / span 2;justify-self:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bubble" role="group" aria-label="Choisir un moteur de recherche">
 <div class="heading"><span>RECHERCHE</span><small>Choisir le moteur</small></div>
 <div class="grid">
  <button class="engine" data-engine="gekko" title="GEKKO Search"><span class="symbol"><img src="../assets/quantic-glide-mark.svg" alt=""></span><span class="name">GEKKO</span></button>
  <button class="engine" data-engine="duckduckgo" title="DuckDuckGo"><span class="symbol"><img src="engine-icons/duckduckgo.svg" alt=""></span><span class="name">DuckDuckGo</span></button>
  <button class="engine" data-engine="qwant" title="Qwant"><span class="symbol"><img src="engine-icons/qwant.svg" alt=""></span><span class="name">Qwant</span></button>
  <button class="engine" data-engine="startpage" title="Startpage"><span class="symbol"><img src="engine-icons/startpage.svg" alt=""></span><span class="name">Startpage</span></button>
  <button class="engine" data-engine="brave" title="Brave Search"><span class="symbol"><img src="engine-icons/brave.svg" alt=""></span><span class="name">Brave</span></button>
  <button class="engine" data-engine="searxng" title="SearXNG"><span class="symbol"><img src="engine-icons/searxng.svg" alt=""></span><span class="name">SearXNG</span></button>
  <button class="engine" data-engine="tor" title="Tor via Veil"><span class="symbol"><img src="engine-icons/torbrowser.svg" alt=""></span><span class="name">Tor</span></button>
 </div>
</div>
<script src="engine-picker.js"></script>
</body>
</html>
