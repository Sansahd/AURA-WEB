[package]
name = "quantic-gekko-servo-runtime"
version = "1.0.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[dependencies]
quantic-ladybird-html = { path = "../../quantic-engine/vendor/ladybird_html" }
quantic-fusion-mozilla-network = { path = "../mozilla-network" }
servo = { path = "../../vendor/servo/components/servo", default-features = false, features = ["bundled", "js_jit", "clipboard"] }
servo-embedder-traits = { path = "../../vendor/servo/components/shared/embedder" }
winit = "0.30.13"
euclid = "0.22"
tracing = "0.1.44"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webrender_api = "0.70"
url = "2.5"

egui = "0.34.3"
egui_glow = { version = "0.34.3", features = ["winit"] }
raw-window-handle = "0.6"
urlencoding = "2.1"

http = "1.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
aes-gcm = "0.10.3"
scrypt = "0.11.0"
base64 = "0.22.1"
getrandom = "0.2.16"


ureq = { version = "2.12.1", default-features = false, features = ["tls", "json"] }

[patch."https://github.com/mozilla/nss-rs"]
nss-rs = { path = "../../vendor/nss-rs" }
