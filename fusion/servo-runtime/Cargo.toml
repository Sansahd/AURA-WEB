[package]
name = "quantic-fusion-servo-runtime"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[dependencies]
quantic-engine = { path = "../../quantic-engine", features = ["fusion-servo", "fusion-ladybird-html"] }
servo = { version = "=0.7.0", default-features = false, features = ["bundled", "js_jit", "clipboard"] }
servo-embedder-traits = { version = "=0.7.0" }
winit = "0.30.13"
euclid = "0.22"
tracing = "0.1.44"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webrender_api = "0.70"
url = "2.5"

egui = "0.34.3"
egui_glow = { version = "0.34.3", features = ["winit"] }
raw-window-handle = "0.6"
urlencoding = "2.1"

http = "1.4"
