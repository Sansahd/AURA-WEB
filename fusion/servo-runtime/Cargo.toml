[package]
name = "quantic-fusion-servo-runtime"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[dependencies]
quantic-engine = { path = "../../quantic-engine", features = ["fusion-servo"] }
servo = { git = "https://github.com/servo/servo", tag = "v0.7.0", package = "servo", default-features = false, features = ["bundled", "js_jit", "clipboard"] }
servo-embedder-traits = { git = "https://github.com/servo/servo", tag = "v0.7.0", package = "servo-embedder-traits" }
winit = "0.30.13"
euclid = "0.22"
tracing = "0.1.44"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webrender_api = "0.70"
url = "2.5"
