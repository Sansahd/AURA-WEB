name: Build Quantic Gekko Windows

on:
  push:
    branches: ["feat/gekko-native-1.0"]
    paths:
      - "fusion/servo-runtime/**"
      - "fusion/mozilla-network/**"
      - "vendor/nss-rs"
      - ".gitmodules"
      - "quantic-engine/**"
      - ".github/workflows/build-glide-fusion-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gekko-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Apply Quantic Servo native-download patch
        run: python fusion/servo-runtime/patch-servo.py

      - uses: dtolnay/rust-toolchain@stable

      - name: Install pinned NSS for live Neqo runtime
        uses: mozilla/nss-rs/install-nss@ba8a3f6acffc7e25749054969ccbbb3ca615df7f
        with:
          working-directory: fusion/mozilla-network

      - name: Restore native Windows Python for Stylo
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Fusion dependency contract
        shell: pwsh
        working-directory: fusion/servo-runtime
        run: |
          cargo tree | Out-File fusion-tree.txt
          $tree = Get-Content fusion-tree.txt -Raw
          foreach ($needle in @('servo v0.7', 'mozjs', 'webrender', 'quantic-ladybird-html')) {
            if ($tree -notmatch [regex]::Escape($needle)) {
              Write-Host $tree
              throw "Required Fusion component missing: $needle"
            }
          }
          if ($tree -match 'chromium|electron|cef|webview2') {
            Write-Host $tree
            throw "Forbidden Chromium-family dependency detected"
          }
          Write-Host "QUANTIC FUSION CONTRACT PASSED"

      - name: Check Gekko runtime
        working-directory: fusion/servo-runtime
        run: cargo check

      - name: Run Gekko runtime tests
        working-directory: fusion/servo-runtime
        run: cargo test

      - name: Build Fusion executable
        working-directory: fusion/servo-runtime
        run: cargo build --release

      - name: Real Servo runtime smoke
        shell: pwsh
        run: |
          $fixture = Resolve-Path "fusion\servo-runtime\tests\fixtures"
          $smoke = Join-Path $env:RUNNER_TEMP "gekko-native-smoke.json"
          if (Test-Path $smoke) { Remove-Item $smoke -Force }

          $server = Start-Process python -ArgumentList "-m","http.server","8765","--bind","127.0.0.1","--directory",$fixture -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $env:GEKKO_START_URL = "http://127.0.0.1:8765/smoke.html"
            $env:GEKKO_SMOKE_OUTPUT = $smoke
            $process = Start-Process "fusion\servo-runtime\target\release\quantic-gekko-servo-runtime.exe" -PassThru

            $deadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $smoke)) {
              Start-Sleep -Milliseconds 500
            }

            if (-not (Test-Path $smoke)) {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
              throw "GEKKO native smoke did not produce its result"
            }

            $payload = Get-Content $smoke -Raw | ConvertFrom-Json
            if ($payload.error) { throw "GEKKO native smoke error: $($payload.error)" }
            if ($payload.url -ne $env:GEKKO_START_URL) { throw "Unexpected smoke URL: $($payload.url)" }
            if (-not $payload.dom) { throw "Servo did not render the GEKKO smoke DOM marker" }
            if ($payload.marker -ne "servo-real-runtime") { throw "Unexpected JS smoke marker: $($payload.marker)" }
            if (-not $payload.urlApi -or -not $payload.promiseApi -or -not $payload.textEncoderApi) {
              throw "Required Web APIs missing in native runtime"
            }
            if (-not $payload.webrtcBlocked) { throw "Privacy smoke expected WebRTC to be blocked" }
            if (-not $payload.gpc) { throw "Privacy smoke expected Global Privacy Control" }
            if (-not $payload.dnt) { throw "Privacy smoke expected Do Not Track" }

            $process.WaitForExit(10000) | Out-Null
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              throw "GEKKO native smoke did not exit through SmokeComplete"
            }
            Write-Host "GEKKO NATIVE 1.0 REAL SERVO SMOKE PASSED"
            Get-Content $smoke
          }
          finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Prepare installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "fusion\servo-runtime\target\release\quantic-gekko-servo-runtime.exe" "dist\QuanticGekko.exe"

          New-Item -ItemType Directory -Force dist\portable | Out-Null
          Copy-Item "dist\QuanticGekko.exe" "dist\portable\QuanticGekko.exe"
          New-Item -ItemType File -Force "dist\portable\portable.flag" | Out-Null
          "Gekko Portable`nLes données, favoris, sessions et téléchargements restent dans le dossier GekkoData à côté de l'exécutable." | Set-Content -Encoding UTF8 "dist\portable\LISEZ-MOI.txt"
          Compress-Archive -Path "dist\portable\*" -DestinationPath "Quantic-Gekko-Portable.zip" -Force

          @'
          Unicode True
          !include "MUI2.nsh"
          Name "Quantic Gekko"
          OutFile "Quantic-Gekko-Setup.exe"
          InstallDir "$LOCALAPPDATA\Programs\Quantic Gekko"
          RequestExecutionLevel user

          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "French"

          Section "Quantic Gekko"
            SetOutPath "$INSTDIR"
            File "dist\QuanticGekko.exe"
            CreateDirectory "$SMPROGRAMS\Quantic Gekko"
            CreateShortcut "$DESKTOP\Quantic Gekko.lnk" "$INSTDIR\QuanticGekko.exe"
            CreateShortcut "$SMPROGRAMS\Quantic Gekko\Quantic Gekko.lnk" "$INSTDIR\QuanticGekko.exe"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\QuanticGekko" "DisplayName" "Quantic Gekko"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\QuanticGekko" "UninstallString" "$\"$INSTDIR\Uninstall.exe$\""
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\QuanticGekko" "DisplayVersion" "1.0.0"
            Exec "$INSTDIR\QuanticGekko.exe"
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\Quantic Gekko.lnk"
            Delete "$SMPROGRAMS\Quantic Gekko\Quantic Gekko.lnk"
            RMDir "$SMPROGRAMS\Quantic Gekko"
            Delete "$INSTDIR\QuanticGekko.exe"
            Delete "$INSTDIR\Uninstall.exe"
            RMDir "$INSTDIR"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\QuanticGekko"
          SectionEnd
          '@ | Set-Content -Encoding UTF8 installer-fusion.nsi

          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          & $makensis installer-fusion.nsi

      - name: Verify executable and installer hashes
        shell: pwsh
        run: |
          Get-FileHash dist\QuanticGekko.exe -Algorithm SHA256 | Format-List
          Get-FileHash Quantic-Gekko-Setup.exe -Algorithm SHA256 | Format-List
          Get-FileHash Quantic-Gekko-Portable.zip -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: Quantic-Gekko-Windows
          path: |
            Quantic-Gekko-Setup.exe
            Quantic-Gekko-Portable.zip
          if-no-files-found: error
          retention-days: 30
