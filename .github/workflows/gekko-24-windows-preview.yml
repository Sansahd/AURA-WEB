name: GEKKO 2.4 Windows preview

# Cost guard: manual build only. Never compile Windows on each push.
on:
  workflow_dispatch:
  # One opt-in preview build on the dedicated UI branch, not on main.
  push:
    branches:
      - fix/gekko-ergonomie-20261020

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
      - name: Generate GEKKO branded icons
        shell: pwsh
        run: |
          npm run build:icons
          if ($LASTEXITCODE -ne 0) { throw 'GEKKO branded icon generation failed' }
          if (-not (Test-Path build/gekko.ico)) { throw 'GEKKO Windows ICO missing' }
          if (-not (Test-Path src/assets/gekko-icon.png)) { throw 'GEKKO app PNG missing' }
      - name: Check source and run tests
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'GEKKO checks failed' }
      - name: Check hosted AURA availability (informational)
        shell: pwsh
        continue-on-error: true
        run: node scripts/probe-aura-cloud.cjs
      - name: Test actual Electron layout on Windows
        shell: pwsh
        run: |
          foreach ($position in @('bottom','top','left','right')) {
            $env:GEKKO_LAYOUT_POSITION = $position
            npm run smoke:ui
            if ($LASTEXITCODE -ne 0) { throw "GEKKO visual geometry smoke failed: $position" }
          }
      - name: Upload visual smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GEKKO-Glass-Wide-Screenshot
          path: dist/gekko-glass-wide-smoke-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw 'GEKKO packaging failed' }
          if (-not (Test-Path dist/GEKKO-Setup.exe)) { throw 'GEKKO-Setup.exe missing' }
          Get-FileHash dist/GEKKO-Setup.exe -Algorithm SHA256 | Format-List
      - name: Upload Windows preview installer
        uses: actions/upload-artifact@v4
        with:
          name: GEKKO-2.4-ergonomie-Windows-x64
          path: dist/GEKKO-Setup.exe
          if-no-files-found: error
          retention-days: 14
