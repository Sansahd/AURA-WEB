name: GEKKO 2.4 Windows preview

on:
  push:
    branches: [feat/gekko-2.4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
      - name: Check source and run tests
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'GEKKO checks failed' }
      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw 'GEKKO packaging failed' }
          if (-not (Test-Path dist/GEKKO-Setup.exe)) { throw 'GEKKO-Setup.exe missing' }
          Get-FileHash dist/GEKKO-Setup.exe -Algorithm SHA256 | Format-List
      - name: Upload Windows preview installer
        uses: actions/upload-artifact@v4
        with:
          name: GEKKO-2.4-beta4-Windows-x64
          path: dist/GEKKO-Setup.exe
          if-no-files-found: error
          retention-days: 14
