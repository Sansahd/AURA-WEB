name: Gekko Fusion Quality Gate

on:
  push:
    branches:
      - "quantic-fusion-servo-gecko-ladybird"
    paths:
      - "quantic-engine/**"
      - "fusion/**"
      - ".github/workflows/quantic-fusion-q1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gekko-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servo-runtime:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: fusion/servo-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Apply Quantic Servo native-download patch
        run: python patch-servo.py

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Gekko 8.5 product contract
        shell: pwsh
        run: |
          $runtime = Get-Content src/main.rs -Raw
          $cargo = Get-Content Cargo.toml -Raw
          foreach ($needle in @(
            'paint_gekko_mark',
            'cinematic_ease',
            'notify_ladybird_document_audit',
            'Ladybird actif',
            'GEKKO_VERSION'
          )) {
            if ($runtime -notmatch [regex]::Escape($needle)) {
              throw "Gekko product contract missing: $needle"
            }
          }
          foreach ($legacyBrand in @(
            'Quantic Glide',
            'GLIDE',
            'Glide Fusion',
            'Accueil Glide',
            'Le Web, sans Chromium.'
          )) {
            if ($runtime -cmatch [regex]::Escape($legacyBrand)) {
              throw "Legacy visible branding remains: $legacyBrand"
            }
          }
          if ($cargo -notmatch 'name = "quantic-gekko-servo-runtime"') {
            throw "Gekko runtime package identity missing"
          }
          Write-Host "GEKKO PRODUCT CONTRACT PASSED"

      - name: Resolve Fusion dependency tree
        shell: pwsh
        run: |
          cargo tree | Out-File fusion-tree.txt
          $tree = Get-Content fusion-tree.txt -Raw
          $required = @('servo v', 'stylo', 'mozjs', 'webrender')
          foreach ($needle in $required) {
            if ($tree -notmatch [regex]::Escape($needle)) {
              Write-Host $tree
              throw "Required Fusion component missing: $needle"
            }
          }
          $forbidden = 'chromium|electron|cef|webview2'
          if ($tree -match $forbidden) {
            Write-Host $tree
            throw "Forbidden browser dependency detected"
          }
          Write-Host "FUSION DEPENDENCY CONTRACT PASSED"

      - name: Check Gekko Servo runtime
        run: cargo check

      - name: Run Gekko runtime unit tests
        run: cargo test


  mozilla-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Mozilla Neqo source provenance
        run: |
          grep -q 'mozilla/neqo' quantic-engine/THIRD_PARTY_FUSION.md
          grep -q 'HTTP/3' quantic-engine/THIRD_PARTY_FUSION.md
          test -f fusion/mozilla-network/src/lib.rs

      - uses: dtolnay/rust-toolchain@stable

      - name: Compile real Neqo HTTP3 core
        working-directory: fusion/mozilla-network
        run: cargo check

      - name: Test real Neqo QUIC packet generation
        working-directory: fusion/mozilla-network
        run: cargo test

  ladybird-html:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: quantic-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check standalone Ladybird tokenizer integration
        run: cargo check --features fusion-ladybird-html --lib
      - name: Run focused Ladybird HTML contract smoke test
        run: cargo run --quiet --features fusion-ladybird-html --example ladybird_contract

      - name: Run Quantic Engine compatibility contracts
        run: cargo test --lib --tests --features fusion-ladybird-html

      - name: Compile compatibility and WPT runners
        run: cargo check --bin qcompat --bin qwpt --features fusion-ladybird-html

      - name: Run compatibility scorecard
        run: cargo run --quiet --bin qcompat --features fusion-ladybird-html

      - name: Run executable WPT-style probe
        run: cargo run --quiet --bin qwpt --features fusion-ladybird-html -- --min-pass-rate 100 tests/wpt_gekko_smoke.js
