name: Gekko Fusion Quality Gate

on:
  push:
    branches:
      - "quantic-fusion-servo-gecko-ladybird"
      - "gekko-next-privacy-aura"
      - "gekko-next-h3-full"
    paths:
      - "quantic-engine/**"
      - "fusion/**"
      - ".github/workflows/quantic-fusion-q1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gekko-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servo-runtime:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: fusion/servo-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Apply Quantic Servo native-download patch
        run: python patch-servo.py

      - uses: dtolnay/rust-toolchain@stable

      - name: Install pinned NSS for live Neqo runtime
        uses: mozilla/nss-rs/install-nss@ba8a3f6acffc7e25749054969ccbbb3ca615df7f
        with:
          working-directory: fusion/mozilla-network

      - name: Restore native Windows Python for Stylo
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Gekko 8.5 product contract
        shell: pwsh
        run: |
          $runtime = Get-Content src/main.rs -Raw
          $youtube = Get-Content src/youtube.rs -Raw
          $cargo = Get-Content Cargo.toml -Raw
          foreach ($needle in @(
            'paint_gekko_mark',
            'cinematic_ease',
            'notify_ladybird_document_audit',
            'Ladybird actif',
            'GEKKO_VERSION',
            'neqo_fetch_https',
            'WakeEvent::H3Used',
            'h3_request_is_safe',
            'YOUTUBE_CLEAN_PLAYBACK_SCRIPT'
          )) {
            if ($runtime -notmatch [regex]::Escape($needle)) {
              throw "Gekko product contract missing: $needle"
            }
          }
          foreach ($legacyBrand in @(
            'Quantic Glide',
            'GLIDE',
            'Glide Fusion',
            'Accueil Glide',
            'Le Web, sans Chromium.'
          )) {
            if ($runtime -cmatch [regex]::Escape($legacyBrand)) {
              throw "Legacy visible branding remains: $legacyBrand"
            }
          }
          if ($cargo -notmatch 'name = "quantic-gekko-servo-runtime"') {
            throw "Gekko runtime package identity missing"
          }
          if ($cargo -notmatch 'quantic-fusion-mozilla-network') {
            throw "Live Neqo runtime dependency missing"
          }
          foreach ($needle in @(
            '/youtubei/v1/player',
            'adPlacements',
            'googlevideo.com',
            'MutationObserver',
            'ad-showing'
          )) {
            if ($youtube -notmatch [regex]::Escape($needle)) {
              throw "YouTube Clean Playback contract missing: $needle"
            }
          }
          Write-Host "GEKKO PRODUCT CONTRACT PASSED"

      - name: Resolve Fusion dependency tree
        shell: pwsh
        run: |
          cargo tree | Out-File fusion-tree.txt
          $tree = Get-Content fusion-tree.txt -Raw
          $required = @('servo v', 'stylo', 'mozjs', 'webrender')
          foreach ($needle in $required) {
            if ($tree -notmatch [regex]::Escape($needle)) {
              Write-Host $tree
              throw "Required Fusion component missing: $needle"
            }
          }
          $forbidden = 'chromium|electron|cef|webview2'
          if ($tree -match $forbidden) {
            Write-Host $tree
            throw "Forbidden browser dependency detected"
          }
          Write-Host "FUSION DEPENDENCY CONTRACT PASSED"

      - name: Check Gekko Servo runtime
        run: cargo check

      - name: Run Gekko runtime unit tests
        run: cargo test

      - name: Build Gekko E2E executable
        run: cargo build

      - name: Run real Gekko WebView E2E smoke
        shell: pwsh
        run: |
          $fixtureDir = (Resolve-Path "tests/fixtures").Path
          $server = Start-Process python -ArgumentList @("-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", $fixtureDir) -PassThru
          try {
            Start-Sleep -Seconds 2
            $env:GEKKO_START_URL = "http://127.0.0.1:8765/smoke.html"
            $env:GEKKO_SMOKE_OUTPUT = (Join-Path $PWD "gekko-smoke.json")
            $env:GEKKO_REDUCED_MOTION = "1"
            $exe = Join-Path $PWD "target/debug/quantic-gekko-servo-runtime.exe"
            $stdout = Join-Path $PWD "gekko-smoke.stdout.log"
            $stderr = Join-Path $PWD "gekko-smoke.stderr.log"
            $app = Start-Process $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            try {
              Wait-Process -Id $app.Id -Timeout 60 -ErrorAction Stop
            } catch {
              Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
              Get-Content $stdout -ErrorAction SilentlyContinue | Write-Host
              Get-Content $stderr -ErrorAction SilentlyContinue | Write-Host
              throw "Gekko E2E smoke timed out"
            }
            $app.Refresh()
            if (!(Test-Path $env:GEKKO_SMOKE_OUTPUT)) {
              Get-Content $stdout -ErrorAction SilentlyContinue | Write-Host
              Get-Content $stderr -ErrorAction SilentlyContinue | Write-Host
              throw "Gekko E2E output was not produced (exit=$($app.ExitCode))"
            }
            $data = Get-Content $env:GEKKO_SMOKE_OUTPUT -Raw | ConvertFrom-Json
            foreach ($pair in @{
              dom = $true
              result = "ready"
              marker = "ok"
              params = "7"
              events = 1
              encodedLength = 3
              storage = "ok"
              urlApi = $true
              promiseApi = $true
              textEncoderApi = $true
              webrtcBlocked = $true
            }.GetEnumerator()) {
              if ($data.($pair.Key) -ne $pair.Value) {
                $data | ConvertTo-Json -Depth 5 | Write-Host
                throw "Gekko E2E assertion failed: $($pair.Key)"
              }
            }
            Write-Host "GEKKO REAL WEBVIEW E2E PASSED"
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }


  mozilla-network:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify Mozilla Neqo source provenance
        run: |
          grep -q 'mozilla/neqo' quantic-engine/THIRD_PARTY_FUSION.md
          grep -q 'HTTP/3' quantic-engine/THIRD_PARTY_FUSION.md
          test -f fusion/mozilla-network/src/lib.rs

      - uses: dtolnay/rust-toolchain@stable

      - name: Install pinned NSS for Neqo
        uses: mozilla/nss-rs/install-nss@ba8a3f6acffc7e25749054969ccbbb3ca615df7f
        with:
          working-directory: fusion/mozilla-network

      - name: Compile real Neqo HTTP3 core
        working-directory: fusion/mozilla-network
        run: cargo check

      - name: Test real Neqo QUIC packet generation
        working-directory: fusion/mozilla-network
        run: cargo test

  ladybird-html:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: quantic-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check standalone Ladybird tokenizer integration
        run: cargo check --features fusion-ladybird-html --lib
      - name: Run focused Ladybird HTML contract smoke test
        run: cargo run --quiet --features fusion-ladybird-html --example ladybird_contract

      - name: Run Quantic Engine compatibility contracts
        run: cargo test --lib --tests --features fusion-ladybird-html

      - name: Compile compatibility and WPT runners
        run: cargo check --bin qcompat --bin qwpt --features fusion-ladybird-html

      - name: Run compatibility scorecard
        run: cargo run --quiet --bin qcompat --features fusion-ladybird-html

      - name: Run executable WPT-style probe
        run: cargo run --quiet --bin qwpt --features fusion-ladybird-html -- --min-pass-rate 100 tests/wpt_gekko_smoke.js
