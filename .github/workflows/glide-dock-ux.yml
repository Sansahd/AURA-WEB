name: Glide Dock UX

on:
  workflow_dispatch:

# Legacy Glide preview kept for manual regression comparison only.
permissions:
  contents: read

concurrency:
  group: quantic-fusion-q1
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: quantic-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libgl1-mesa-dev

      - name: Check Glide Dock
        run: cargo check --bin qglide --no-default-features
      - name: Build Glide Dock
        run: cargo build --bin qglide --no-default-features
      - name: Verify zero Chromium family
        shell: bash
        run: |
          cargo tree --no-default-features > glide-tree.txt
          if grep -Eiq 'chromium|electron|cef|webview2' glide-tree.txt; then
            cat glide-tree.txt
            echo "Forbidden browser dependency detected"
            exit 1
          fi
          echo "GLIDE DOCK ZERO-CHROMIUM CHECK PASSED"
