name: Build Glide Native 0.6.1 Cross

on:
  push:
    branches:
      - "native-zero-chromium"
    paths:
      - "quantic-engine/**"
      - ".github/workflows/glide-native-linux-cross.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-zero-chromium-cross
  cancel-in-progress: true

jobs:
  cross-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: quantic-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW and NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis

      - name: Verify zero Chromium
        run: |
          cargo tree --edges normal > cargo-tree.txt
          if grep -Eiq 'chromium|electron|cef|webview2|webkit' cargo-tree.txt; then
            cat cargo-tree.txt
            echo "Forbidden browser dependency detected"
            exit 1
          fi
          echo "ZERO-CHROMIUM CHECK PASSED"

      - name: Build Windows binaries
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --target x86_64-pc-windows-gnu --bin qglide --bin qcareer

      - name: Prepare payload
        run: |
          mkdir -p installer
          cp target/x86_64-pc-windows-gnu/debug/qglide.exe installer/QuanticGlide.exe
          cp target/x86_64-pc-windows-gnu/debug/qcareer.exe installer/AURACareer.exe

      - name: Create NSIS installer
        run: |
          cat > installer.nsi <<'NSIS'
          Unicode True
          !include "MUI2.nsh"
          Name "Quantic Glide Native 0.6.1"
          OutFile "Quantic-Glide-Native-0.6.1-Setup.exe"
          InstallDir "$LOCALAPPDATA\Programs\Quantic Glide Native"
          RequestExecutionLevel user

          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "French"

          Section "Quantic Glide Native" SEC01
            SetOutPath "$INSTDIR"
            File "installer\QuanticGlide.exe"
            File "installer\AURACareer.exe"
            CreateDirectory "$SMPROGRAMS\Quantic Glide Native"
            CreateShortcut "$DESKTOP\Quantic Glide Native.lnk" "$INSTDIR\QuanticGlide.exe"
            CreateShortcut "$SMPROGRAMS\Quantic Glide Native\Quantic Glide Native.lnk" "$INSTDIR\QuanticGlide.exe"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\QuanticGlideNative" "DisplayName" "Quantic Glide Native"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\QuanticGlideNative" "UninstallString" "$\"$INSTDIR\Uninstall.exe$\""
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\QuanticGlideNative" "DisplayVersion" "0.6.1"
            Exec "$INSTDIR\QuanticGlide.exe"
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\Quantic Glide Native.lnk"
            Delete "$SMPROGRAMS\Quantic Glide Native\Quantic Glide Native.lnk"
            RMDir "$SMPROGRAMS\Quantic Glide Native"
            Delete "$INSTDIR\QuanticGlide.exe"
            Delete "$INSTDIR\AURACareer.exe"
            Delete "$INSTDIR\Uninstall.exe"
            RMDir "$INSTDIR"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\QuanticGlideNative"
          SectionEnd
          NSIS
          makensis installer.nsi

      - name: SHA256
        run: sha256sum Quantic-Glide-Native-0.6.1-Setup.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Quantic-Glide-Native-0.6.1
          path: quantic-engine/Quantic-Glide-Native-0.6.1-Setup.exe
          if-no-files-found: error
          retention-days: 7
