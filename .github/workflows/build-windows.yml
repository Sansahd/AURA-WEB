name: Build Windows Installer
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: windows-installer
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check
        run: npm run check
      - name: Build
        run: npm run dist
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GEKKO-Setup
          path: dist/GEKKO-Setup.exe
          if-no-files-found: error
          retention-days: 7
