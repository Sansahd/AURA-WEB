name: Build Windows Installer
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: windows-installer
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check
        run: npm run check
      - name: Build
        run: npm run dist
      - name: Smoke install
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist/GEKKO-Setup.exe").Path
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "GEKKO installer exited with code $($process.ExitCode)"
          }

          $programs = Join-Path $env:LOCALAPPDATA "Programs"
          $exe = Get-ChildItem -Path $programs -Filter "GEKKO Browser.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            throw "GEKKO Browser.exe was not installed under $programs"
          }

          $uninstall = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
            Get-ItemProperty |
            Where-Object { $_.DisplayName -eq "GEKKO Browser" } |
            Select-Object -First 1
          if (-not $uninstall) {
            throw "GEKKO Browser uninstall registration was not created"
          }

          Write-Host "Installed:" $exe.FullName
          Write-Host "Uninstall key:" $uninstall.PSPath
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GEKKO-Setup
          path: dist/GEKKO-Setup.exe
          if-no-files-found: error
          retention-days: 7
