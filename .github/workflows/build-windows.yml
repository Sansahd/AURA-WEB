name: Build Windows Installer
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: windows-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Build
        run: npm run dist

      - name: Smoke install and visible launch
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist/GEKKO-Setup.exe").Path
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "GEKKO installer exited with code $($process.ExitCode)"
          }

          $programs = Join-Path $env:LOCALAPPDATA "Programs"
          $exe = Get-ChildItem -Path $programs -Filter "GEKKO Browser.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            throw "GEKKO Browser.exe was not installed under $programs"
          }

          $uninstaller = Get-ChildItem -Path $exe.Directory.FullName -Filter "Uninstall*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) {
            throw "GEKKO uninstaller executable was not created"
          }

          $resources = Join-Path $exe.Directory.FullName "resources"
          $shell = Join-Path $resources "quantic-ui\renderer\index.html"
          $shellJs = Join-Path $resources "quantic-ui\renderer\renderer.js"
          $shellLogo = Join-Path $resources "quantic-ui\assets\quantic-glide-logo.svg"

          foreach ($required in @($shell, $shellJs, $shellLogo)) {
            if (-not (Test-Path $required)) {
              throw "Required quantic-ui resource missing: $required"
            }
          }

          $shellText = Get-Content -Raw $shell
          if ($shellText -notmatch "<title>GEKKO</title>") {
            throw "Installed quantic-ui shell content is invalid"
          }
          Write-Host "Shell resource validated:" $shell

          Get-Process -Name "GEKKO Browser" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $stdout = Join-Path $env:RUNNER_TEMP "gekko-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "gekko-stderr.log"
          Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue
          $env:ELECTRON_ENABLE_LOGGING = "true"

          Start-Process -FilePath $exe.FullName -ArgumentList "--enable-logging=stderr","--v=1" -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $visible = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            $window = Get-Process -Name "GEKKO Browser" -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne 0 } |
              Select-Object -First 1
            if ($window) {
              Write-Host "Installed GEKKO visible window handle:" $window.MainWindowHandle
              $visible = $true
              break
            }
          }

          if (-not $visible) {
            Get-Process -Name "GEKKO Browser" -ErrorAction SilentlyContinue | Format-List *
            Write-Host "===== GEKKO STDOUT ====="
            if (Test-Path $stdout) { Get-Content $stdout -ErrorAction SilentlyContinue }
            Write-Host "===== GEKKO STDERR ====="
            if (Test-Path $stderr) { Get-Content $stderr -ErrorAction SilentlyContinue }
            throw "Installed GEKKO did not create a visible window within 10 seconds"
          }

          Get-Process -Name "GEKKO Browser" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "Installed:" $exe.FullName
          Write-Host "Uninstaller:" $uninstaller.FullName


      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GEKKO-Setup
          path: dist/GEKKO-Setup.exe
          if-no-files-found: error
          retention-days: 7
