name: Gekko Compile & Test Mac

on:
  push:
    branches: ["quantic-fusion-servo-gecko-ladybird", "gekko-next-privacy-aura"]
    paths:
      - "quantic-engine/**"
      - "fusion/servo-runtime/**"
      - "fusion/mozilla-network/**"
      - "vendor/nss-rs"
      - ".gitmodules"
      - ".github/workflows/fusion-compile-mac.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gekko-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: quantic-engine
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Gekko core
        run: cargo check --bin qgekko --no-default-features
      - name: Check Ladybird HTML Fusion
        run: cargo check --lib --features fusion-ladybird-html
      - name: Run engine compatibility tests
        run: cargo test --lib --tests --features fusion-ladybird-html

  servo:
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: fusion/servo-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Apply Quantic Servo native-download patch
        run: python patch-servo.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned NSS for live Neqo runtime
        uses: mozilla/nss-rs/install-nss@ba8a3f6acffc7e25749054969ccbbb3ca615df7f
        with:
          working-directory: fusion/mozilla-network
      - name: Resolve Servo 0.7 Fusion
        run: cargo tree > servo-tree.txt
      - name: Verify Servo Mozilla stack
        run: |
          grep -qi "servo v0.7" servo-tree.txt
          grep -Eqi "stylo|style v" servo-tree.txt
          grep -qi "mozjs" servo-tree.txt
          grep -qi "webrender" servo-tree.txt
          ! grep -Eiq "chromium|electron|cef|webview2" servo-tree.txt
      - name: Check Servo/WebRender Gekko
        run: cargo check
      - name: Run Gekko runtime tests
        run: cargo test

      - name: Build Gekko release
        run: cargo build --release

      - name: Build Gekko macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/dist/Gekko.app"
          BIN="$APP/Contents/MacOS/QuanticGekko"
          FRAMEWORKS="$APP/Contents/Frameworks"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$FRAMEWORKS"
          cp target/release/quantic-gekko-servo-runtime "$BIN"
          chmod +x "$BIN"
          cp assets/gekko-mark.svg "$APP/Contents/Resources/gekko-mark.svg"

          NSS_LIB_DIR="$(find "$NSS_DIR/.." -type f -name 'libssl3.dylib' -print -quit | xargs dirname)"
          test -d "$NSS_LIB_DIR"
          cp "$NSS_LIB_DIR"/*.dylib "$FRAMEWORKS/"
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$BIN" || true

          for dylib in "$FRAMEWORKS"/*.dylib; do
            install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib" || true
          done

          for target in "$BIN" "$FRAMEWORKS"/*.dylib; do
            while IFS= read -r dep; do
              base="$(basename "$dep")"
              if [[ -f "$FRAMEWORKS/$base" ]]; then
                install_name_tool -change "$dep" "@rpath/$base" "$target" || true
              fi
            done < <(otool -L "$target" | tail -n +2 | awk '{print $1}')
          done
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Gekko</string>
            <key>CFBundleDisplayName</key><string>Quantic Gekko</string>
            <key>CFBundleIdentifier</key><string>com.quantic.gekko</string>
            <key>CFBundleVersion</key><string>0.8.5</string>
            <key>CFBundleShortVersionString</key><string>0.8.5</string>
            <key>CFBundleExecutable</key><string>QuanticGekko</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/Quantic-Gekko-macOS.zip"

      - name: Verify macOS bundle
        shell: bash
        run: |
          BIN="$GITHUB_WORKSPACE/dist/Gekko.app/Contents/MacOS/QuanticGekko"
          FRAMEWORKS="$GITHUB_WORKSPACE/dist/Gekko.app/Contents/Frameworks"
          test -x "$BIN"
          test -f "$GITHUB_WORKSPACE/dist/Gekko.app/Contents/Info.plist"
          test -f "$FRAMEWORKS/libssl3.dylib"
          test -f "$FRAMEWORKS/libnss3.dylib"
          otool -L "$BIN"
          if otool -L "$BIN" | grep -F "$NSS_DIR"; then
            echo "Gekko binary still references CI NSS path"
            exit 1
          fi
          shasum -a 256 "$GITHUB_WORKSPACE/Quantic-Gekko-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Quantic-Gekko-macOS
          path: Quantic-Gekko-macOS.zip
          if-no-files-found: error
          retention-days: 30
