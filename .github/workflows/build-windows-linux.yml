name: Build Windows Installer via Wine

on:
  push:
    branches: [installer-linux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          node -v
          npm -v
          wine --version
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check
        run: npm run check
      - name: Prepare Wine home
        run: |
          mkdir -p /tmp/winehome /tmp/wineprefix
          chmod 777 /tmp/winehome /tmp/wineprefix

      - name: Build Windows NSIS
        env:
          HOME: /tmp/winehome
          WINEPREFIX: /tmp/wineprefix
        run: npm run dist
      - name: Show dist
        run: ls -lah dist
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Quantic-Glide-AURA-Career-Setup
          path: dist/Quantic-Glide-AURA-Career-Setup.exe
          if-no-files-found: error
          retention-days: 7
