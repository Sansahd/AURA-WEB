name: Build Glide Dock Windows Preview

on:
  push:
    branches:
      - "quantic-fusion-servo-gecko-ladybird"
    paths:
      - "quantic-engine/Cargo.toml"
      - "quantic-engine/src/bin/qglide.rs"
      - "quantic-engine/src/**"
      - ".github/workflows/build-glide-dock-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glide-dock-windows-preview-ubuntu24
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: quantic-engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install cross compiler and NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis

      - name: Build Windows Glide Dock
        run: cargo build --target x86_64-pc-windows-gnu --bin qglide --no-default-features

      - name: Verify zero Chromium family
        run: |
          cargo tree --no-default-features > glide-tree.txt
          if grep -Eiq 'chromium|electron|cef|webview2' glide-tree.txt; then
            cat glide-tree.txt
            echo "Forbidden browser dependency detected"
            exit 1
          fi

      - name: Prepare installer payload
        run: |
          mkdir -p installer
          cp target/x86_64-pc-windows-gnu/debug/qglide.exe installer/QuanticGlide.exe

      - name: Create installer
        run: |
          cat > installer.nsi <<'NSIS'
          Unicode True
          !include "MUI2.nsh"
          Name "Quantic Glide Dock Preview"
          OutFile "Quantic-Glide-Dock-Preview-Setup.exe"
          InstallDir "$LOCALAPPDATA\Programs\Quantic Glide"
          RequestExecutionLevel user

          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "French"

          Section "Quantic Glide" SEC01
            SetOutPath "$INSTDIR"
            File "installer\QuanticGlide.exe"
            CreateDirectory "$SMPROGRAMS\Quantic Glide"
            CreateShortcut "$DESKTOP\Quantic Glide.lnk" "$INSTDIR\QuanticGlide.exe"
            CreateShortcut "$SMPROGRAMS\Quantic Glide\Quantic Glide.lnk" "$INSTDIR\QuanticGlide.exe"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\QuanticGlideDockPreview" "DisplayName" "Quantic Glide Dock Preview"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\QuanticGlideDockPreview" "UninstallString" "$\"$INSTDIR\Uninstall.exe$\""
            Exec "$INSTDIR\QuanticGlide.exe"
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\Quantic Glide.lnk"
            Delete "$SMPROGRAMS\Quantic Glide\Quantic Glide.lnk"
            RMDir "$SMPROGRAMS\Quantic Glide"
            Delete "$INSTDIR\QuanticGlide.exe"
            Delete "$INSTDIR\Uninstall.exe"
            RMDir "$INSTDIR"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\QuanticGlideDockPreview"
          SectionEnd
          NSIS
          makensis installer.nsi

      - name: SHA256
        run: sha256sum Quantic-Glide-Dock-Preview-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Quantic-Glide-Dock-Preview
          path: quantic-engine/Quantic-Glide-Dock-Preview-Setup.exe
          if-no-files-found: error
          retention-days: 7
