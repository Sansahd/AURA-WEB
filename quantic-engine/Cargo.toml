[package]
name = "quantic-engine"
version = "0.7.0-fusion.1"
edition = "2021"
license = "MPL-2.0"
description = "Experimental non-Chromium web engine core for Quantic Glide"

[lib]
name = "quantic_engine"
path = "src/lib.rs"

[[bin]]
name = "qengine"
path = "src/bin/qengine.rs"

[[bin]]
name = "qcompat"
path = "src/bin/qcompat.rs"

[[bin]]
name = "qwpt"
path = "src/bin/qwpt.rs"

[[bin]]
name = "qcareer"
path = "src/bin/qcareer.rs"

[[bin]]
name = "qglide"
path = "src/bin/qglide.rs"

[[bin]]
name = "qfusion-servo"
path = "src/bin/qfusion_servo.rs"
required-features = ["fusion-servo"]

[features]
default = []
fusion-servo = [
  "dep:servo",
  "dep:servo-embedder-traits",
  "dep:winit",
  "dep:euclid",
  "dep:tracing",
  "dep:rustls",
  "dep:webrender_api",
]
fusion-gecko-network = [
  "dep:neqo-common",
  "dep:neqo-http3",
  "dep:neqo-transport",
]
fusion-ladybird-html = ["dep:quantic-ladybird-html"]
fusion = ["fusion-servo", "fusion-gecko-network", "fusion-ladybird-html"]

[dependencies]
boa_engine = { version = "0.22.0", default-features = false }
font8x8 = "0.3.1"
fontdb = "0.24.0"
fontdue = "0.9.4"
rustybuzz = "0.20.1"
unicode-segmentation = "1.13.3"
oxifont-webfont = { version = "0.2.2", features = ["woff1", "woff2"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "avif"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2.5"
urlencoding = "2.1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
eframe = { version = "0.33.0", default-features = false, features = ["default_fonts", "glow"] }

# Ladybird LibWeb HTML tokenizer, adapted as a standalone Rust crate under BSD-2-Clause.
quantic-ladybird-html = { path = "vendor/ladybird_html", optional = true }

# Quantic Fusion upstream engines/components.
# Servo is the primary standards/runtime backend. It brings Stylo, SpiderMonkey and WebRender.
servo = { git = "https://github.com/servo/servo", tag = "v0.7.0", package = "servo", default-features = false, features = ["bundled", "js_jit", "clipboard"], optional = true }
servo-embedder-traits = { git = "https://github.com/servo/servo", tag = "v0.7.0", package = "servo-embedder-traits", optional = true }
winit = { version = "0.30.13", optional = true }
euclid = { version = "0.22", optional = true }
tracing = { version = "0.1.44", optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
webrender_api = { version = "0.70", optional = true }

# Mozilla Neqo: Firefox/Mozilla QUIC + HTTP/3 stack.
neqo-common = { git = "https://github.com/mozilla/neqo", rev = "28b49f73b06f71aa602180e4dcc3a2b522103b51", package = "neqo-common", optional = true }
neqo-http3 = { git = "https://github.com/mozilla/neqo", rev = "28b49f73b06f71aa602180e4dcc3a2b522103b51", package = "neqo-http3", optional = true }
neqo-transport = { git = "https://github.com/mozilla/neqo", rev = "28b49f73b06f71aa602180e4dcc3a2b522103b51", package = "neqo-transport", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
